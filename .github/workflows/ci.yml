name: ci

on:
  push:
    branches:
      - master
      - dev-master
  pull_request:
    branches:
      - master
      - dev-master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true
          pip install "psycopg2-binary>=2.9.9"

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          secret_key: "ci-secret-key-0123456789abcdef0123456789abcdef0123456789abcdef"
          debug: "True"
          allowed_hosts: "*"
          site_url: "127.0.0.1"
          db_type: "sqlite"
          storage_key_id: "dev-storage-key"
          storage_secret_key: "dev-storage-secret"
          storage_bucket_name: "dev-bucket"
          storage_endpoint_url: "https://s3.us-east-2.amazonaws.com"
          email_use_tls: "True"
          email_host: "smtp.example.com"
          email_host_user: "noreply@example.com"
          email_host_password: "dev-password"
          from_email: "MySite <noreply@example.com>"
          email_port: "587"
          google_recaptcha_secret_key: "dev-recaptcha-secret"
          google_recaptcha_site_key: "dev-recaptcha-site"
          site_name: "Project-Olly"
          site_server: "Dev-Env"
          user_verification: "False"
          esports_mode: "True"
          enable_store: "True"
          enable_wagers: "True"
          paypal_email: "dev@example.com"

      - name: Run tests
        run: python manage.py test
        env:
          secret_key: "ci-secret-key-0123456789abcdef0123456789abcdef0123456789abcdef"
          debug: "True"
          allowed_hosts: "*"
          site_url: "127.0.0.1"
          db_type: "sqlite"
          storage_key_id: "dev-storage-key"
          storage_secret_key: "dev-storage-secret"
          storage_bucket_name: "dev-bucket"
          storage_endpoint_url: "https://s3.us-east-2.amazonaws.com"
          email_use_tls: "True"
          email_host: "smtp.example.com"
          email_host_user: "noreply@example.com"
          email_host_password: "dev-password"
          from_email: "MySite <noreply@example.com>"
          email_port: "587"
          google_recaptcha_secret_key: "dev-recaptcha-secret"
          google_recaptcha_site_key: "dev-recaptcha-site"
          site_name: "Project-Olly"
          site_server: "Dev-Env"
          user_verification: "False"
          esports_mode: "True"
          enable_store: "True"
          enable_wagers: "True"
          paypal_email: "dev@example.com"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          push: false
          tags: project-olly:ci