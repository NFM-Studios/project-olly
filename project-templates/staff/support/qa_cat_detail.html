{% extends "staff/staffbase.html" %}
{% load static %}
<link rel="stylesheet" href="{% static "css/staff.css" %}">
{% block title %}
    Edit Q&A Category
{% endblock %}
{% block body %}
    <form method="post">
        {% csrf_token %}

        {{ field.errors }}

        <label>Name</label>
        <div class="form-group">{{ form.name }}</div>


        <button type="submit" class="btn btn-primary">Submit</button>

    </form>
    <form method="post" action="{% url 'staff:qa_cat_delete' pk=pk %}" onsubmit="return confirm('Are you sure you want to delete this category?');" style="display:inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
    </form>
{% endblock %}
