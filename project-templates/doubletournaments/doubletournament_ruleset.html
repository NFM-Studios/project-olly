{% extends "base.html" %}
{% load static %}

{% block head %}
    <title>{{ ruleset.name }} - {{ SITE_NAME }}</title>
{% endblock %}

{% block body %}
    <div class="container page">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <h1>{{ ruleset.name }}</h1>
                    <br>
                    {{ ruleset.text|linebreaksbr }}

                    <br>
                    <br>
                    <p>Last updated {{ ruleset.updated }}</p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
